kind = "mobile"
previewPath = "/pint-wars/"
title = "Pint Wars"
description = "A social pub competition app where friends join private 30-day Pint Wars, track leaderboard progress, and celebrate the final champion."
version = "1.0.0"
id = "artifacts/pint-wars"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/pint-wars/" ]
localPort = 22476

[services.development]
run = "pnpm --filter @workspace/pint-wars run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pint-wars", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pint-wars", "run", "serve" ]

[services.env]
PORT = "22476"
BASE_PATH = "/pint-wars/"
